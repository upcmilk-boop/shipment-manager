<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{
  --pri:#1F3864;--pri-dark:#122240;--acc:#2563eb;--acc-soft:#eff6ff;
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --ok:#16a34a;--ok-soft:#dcfce7;--warn:#d97706;--warn-soft:#fef3c7;--err:#dc2626;--err-soft:#fee2e2;
  --shadow:0 4px 20px -2px rgba(15,23,42,.07),0 2px 6px -1px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Calibri,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#0f172a 0%,#1F3864 60%,#1e40af 100%);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,23,42,.18);position:sticky;top:0;z-index:40}
.logo{display:inline-flex;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#2563eb);align-items:center;justify-content:center;font-weight:900;font-size:20px;margin-right:12px;vertical-align:middle;box-shadow:0 4px 10px rgba(37,99,235,.4)}
header h1{display:inline;font-size:19px;font-weight:700;vertical-align:middle;letter-spacing:-.2px}
.bd{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);color:#e0f2fe;padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;text-decoration:none;transition:.2s;cursor:pointer}
.bd:hover{background:rgba(255,255,255,.22);color:#fff}
header input{padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;width:145px;font-size:14px;outline:none}
header input::placeholder{color:#cbd5e1}
header input:focus{background:rgba(255,255,255,.22);border-color:#7dd3fc}

.app{display:flex;min-height:calc(100vh - 68px)}
nav{width:230px;background:var(--card);border-right:1px solid var(--border);padding:14px 12px;flex-shrink:0}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-radius:10px;font:inherit;font-size:15px;font-weight:600;color:#475569;cursor:pointer;margin-bottom:4px;transition:.18s}
nav button:hover{background:#f8fafc;color:var(--pri)}
nav button.on{background:linear-gradient(135deg,#1F3864,#1e40af);color:#fff;box-shadow:0 4px 12px rgba(31,56,100,.25)}
main{flex:1;padding:20px;min-width:0;max-width:1600px}

@media(max-width:820px){
  .app{display:block}
  nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
  nav button{white-space:nowrap;width:auto;margin-bottom:0;margin-right:4px}
}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;color:var(--pri);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--pri);line-height:1.15}
.kpi span{color:var(--muted);font-size:13px;font-weight:600}

button.b{background:linear-gradient(135deg,#1F3864,#1e40af);color:#fff;border:0;border-radius:9px;padding:10px 18px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 2px 6px rgba(31,56,100,.2);display:inline-flex;align-items:center;gap:6px}
button.b:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,56,100,.28)}
button.b.okbtn{background:linear-gradient(135deg,#15803d,#16a34a)}
button.o{background:#fff;color:var(--pri);border:1.5px solid #cbd5e1;border-radius:9px;padding:9px 15px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
button.o:hover{border-color:var(--pri);background:var(--acc-soft)}
button.s{padding:6px 12px;font-size:13px;font-weight:600;border-radius:7px;border:1px solid #cbd5e1;background:#fff;color:var(--pri);cursor:pointer;transition:.15s}
button.s:hover{background:var(--acc-soft);border-color:var(--acc)}
button.r{color:var(--err);border-color:#fecaca}
button.r:hover{background:var(--err-soft)}

input,select,textarea{padding:10px 13px;border:1.5px solid #cbd5e1;border-radius:9px;font:inherit;font-size:14.5px;max-width:100%;background:#fff;color:var(--text);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{width:100%;min-height:110px;font-family:Consolas,monospace}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.w{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:540px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 14px;border-bottom:1px solid #f1f5f9;text-align:left;white-space:nowrap;font-size:14.5px}
th{background:#f8fafc;color:var(--pri);font-weight:700;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--border)}
tr:hover td{background:#f8fafc}
tr.sel td{background:#eff6ff!important}
td.dl{font-weight:700;letter-spacing:.3px;color:#0f172a;font-family:Consolas,"Segoe UI",monospace;font-size:15px}

td.ck,th.ck{width:54px;text-align:center;cursor:pointer;user-select:none}
.bx{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:2px solid #94a3b8;border-radius:6px;background:#fff;vertical-align:middle;transition:.15s}
tr.sel .bx,.bx.on{background:var(--pri);border-color:var(--pri)}
tr.sel .bx::after,.bx.on::after{content:'\2713';color:#fff;font-size:16px;font-weight:800;line-height:1}

.ab{position:sticky;top:68px;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1.5px solid var(--pri);border-radius:12px;padding:11px 16px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 20px -4px rgba(31,56,100,.14)}
.tgl-box{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:9px;border:2px solid var(--pri);background:#fff;color:var(--pri);font-weight:700;font-size:14.5px;cursor:pointer;user-select:none;transition:.15s}
.tgl-box:hover{background:var(--acc-soft)}
.tgl-box.checked{background:var(--pri);color:#fff}
.tgl-box.checked .bx{background:#fff;border-color:#fff}
.tgl-box.checked .bx::after{content:'\2713';color:var(--pri);font-size:16px;font-weight:900}
.tgl-box.partial .bx{background:var(--acc);border-color:var(--acc)}
.tgl-box.partial .bx::after{content:'\2212';color:#fff;font-size:16px;font-weight:900}

.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e0e7ff;color:#1e3a8a}
.tag.u{background:var(--warn-soft);color:#92400e}
.tag.x{background:var(--err-soft);color:#991b1b}
.tag.riyadh{background:#dcfce7;color:#166534}

.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar i{display:block;height:14px;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:99px}
.bar span{min-width:120px;font-weight:600;font-size:14px}

.m{font-size:13.5px;color:var(--muted);margin:6px 0}
.ok{color:var(--ok);font-weight:700}
.er{color:var(--err);font-weight:700}
.nt{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tip{font-size:13.5px;color:#334155;background:#e0f2fe;border:1px solid #bae6fd;padding:9px 14px;border-radius:10px;margin:6px 0 12px}

.ms{position:relative;display:inline-block}
.ms summary{list-style:none;cursor:pointer;padding:9px 15px;border:1.5px solid #cbd5e1;border-radius:9px;background:#fff;font-weight:600;font-size:14.5px;color:var(--pri);transition:.15s}
.ms summary:hover{border-color:var(--pri)}
.ms[open] summary{background:var(--acc-soft);border-color:var(--acc)}
.mo{position:absolute;z-index:35;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px;max-height:280px;overflow:auto;min-width:200px;box-shadow:0 10px 25px rgba(15,23,42,.16);margin-top:4px}
.mo label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;white-space:nowrap;cursor:pointer;font-size:14px}
.mo label:hover{background:#f1f5f9}

button.ch{border:1.5px solid #cbd5e1;background:#fff;color:var(--pri);border-radius:99px;padding:8px 18px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin:3px;transition:.15s}
button.ch:hover{border-color:var(--pri);background:var(--acc-soft)}
button.ch.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 3px 10px rgba(31,56,100,.22)}

.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:#dcfce7;color:#166534;border:1px solid #86efac}
.sync-pill.off{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.sync-pill.busy{background:#fef3c7;color:#92400e;border-color:#fde68a}

@media print{header,nav,button,.row,.nt,.ab,.tip{display:none!important}main{padding:0}.w{max-height:none;border:0}}
</style>
</head>

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.orders){
      if(!s.gsUrl)s.gsUrl='';
      if(!s.phs)s.phs={};
      return s;
    }
  }catch(e){}
  return{orders:[],sched:{},drivers:{},phs:{},hist:[],active:null,reasons:['Cancelled','Stock shortage','Waiting transport'],audit:[],user:'',gsUrl:''};
}

function injectRiyadhMaster(){
  RIYADH_PLANTS.forEach(p=>{
    if(!S.phs[p]) S.phs[p]={area:'RIYADH',active:true};
    else if(!S.phs[p].area) S.phs[p].area='RIYADH';
  });
}

function builtin(){
  const h={id:'S0',name:SCHED0.name,date:'2026-11-01T00:00:00',sched:{},drivers:{JSON:true}};
  Object.entries(SCHED0.p).forEach(([k,v])=>{
    const parts=v.split(':');
    if(parts.length===2){
      const[d,aIdx]=parts;
      const areaName=SCHED0.areas[+aIdx]||'JEDDAH';
      h.sched[k]={days:[...d].map(i=>DAYS[+i]),area:RIYADH_SET.has(k)?'RIYADH':areaName};
    }
  });
  h.drivers=JSON.parse(JSON.stringify(SCHED0.drivers));
  RIYADH_PLANTS.forEach(p=>{
    if(!h.sched[p]) h.sched[p]={days:[],area:'RIYADH'};
    else h.sched[p].area='RIYADH';
  });
  return h;
}

function applySch(h){
  S.active=h.id;
  S.sched=JSON.parse(JSON.stringify(h.sched||{}));
  S.drivers=JSON.parse(JSON.stringify(h.drivers||{}));
  injectRiyadhMaster();
}

function ensureSched(){
  injectRiyadhMaster();
  if(!S.active){
    const h=builtin();
    S.hist=S.hist.filter(x=>x.id!=='S0');
    S.hist.push(h);
    applySch(h);
    save(true);
  }
}

let syncTimer=null;
function setSyncUI(state,txt){
  const el=$('syncBadge');if(!el)return;
  el.className='sync-pill'+(state==='off'?' off':state==='busy'?' busy':'');
  el.innerHTML=txt;
}

function save(skipCloud){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){alert('Browser storage is full or blocked. Download a backup now.')}
  if(!skipCloud && S.gsUrl){
    clearTimeout(syncTimer);
    setSyncUI('busy','&#8635; Syncing...');
    syncTimer=setTimeout(()=>cloudPush(),1200);
  }else if(!S.gsUrl){
    setSyncUI('off','Local Only');
  }
}

async function cloudPush(manual){
  if(!S.gsUrl){if(manual)alert('Please set your Google Apps Script Web App URL in Admin -> Google Sheets Sync first.');return;}
  setSyncUI('busy','&#8635; Saving to Sheet...');
  try{
    await fetch(S.gsUrl,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({user:S.user||'-',state:S})
    });
    setSyncUI('on','&#10004; Sheet Synced');
    if(manual)alert('Data successfully pushed to Google Sheets!');
  }catch(e){
    setSyncUI('off','&#9888; Sync Error');
    if(manual)alert('Sync failed: '+e.message);
  }
}

async function cloudPull(manual){
  if(!S.gsUrl){if(manual)alert('Please paste your Google Apps Script URL in Admin -> Google Sheets Sync first.');return;}
  setSyncUI('busy','&#8635; Loading Sheet...');
  try{
    const res=await fetch(S.gsUrl+'?t='+Date.now());
    const j=await res.json();
    if(j && j.ok && j.data && Array.isArray(j.data.orders)){
      const url=S.gsUrl,usr=S.user;
      S=j.data;
      if(!S.gsUrl)S.gsUrl=url;
      if(usr && !S.user)S.user=usr;
      injectRiyadhMaster();
      save(true);
      setSyncUI('on','&#10004; Sheet Synced');
      render();
      if(manual)alert('Loaded latest data from Google Sheets! ('+S.orders.length+' orders)');
    }else{
      setSyncUI('on','&#10004; Sheet Ready (Empty)');
      if(manual)alert('Connected to Google Sheets! No saved data found yet—your next save will create it.');
    }
  }catch(e){
    setSyncUI('off','&#9888; Pull Failed');
    if(manual)alert('Could not fetch from Google Sheets. Make sure deployment access is set to "Anyone".');
  }
}

function parseOrders(a){const hi=a.findIndex(r=>r.map(nk).includes('delivery'));if(hi<0)throw new Error('Column "Delivery" not found');
  const h=a[hi].map(nk),f=(...n)=>h.findIndex(x=>n.includes(x)),w=f('warehousenumber','whnumber','wh','warehouse'),d=f('delivery','deliverynumber'),p=f('shiptoparty','phnumber','ph','shipto');
  if(w<0||p<0)throw new Error('Need columns: Warehouse Number, Delivery, Ship-to Party');
  return a.slice(hi+1).filter(r=>r.some(c=>cl(c))).map((r,i)=>({wh:cl(r[w]).toUpperCase(),del:cl(r[d]),ph:cl(r[p]).toUpperCase(),line:hi+i+2}))}
function checkRow(o){if(!/^[A-Z0-9]{2,4}$/.test(o.wh))return'WH looks wrong';if(!/^\d{6,12}$/.test(o.del))return'Delivery must be 6-12 digits';if(!CODE.test(o.ph))return'PH looks wrong';return''}
function parseText(t){return t.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean).map((s,i)=>{const x=s.split(/[,\t;\s]+/);return{wh:(x[0]||'').toUpperCase(),del:x[1]||'',ph:(x[2]||'').toUpperCase(),line:i+1}})}

function parseAll(a){const sc={},dr=a.map((r,i)=>r.some(c=>DAYS.includes(cl(c).toLowerCase()))?i:-1).filter(i=>i>=0);
  dr.forEach((d,k)=>{const end=k+1<dr.length?dr[k+1]:a.length,day=[];let cur='';a[d].forEach((c,ci)=>{const v=cl(c).toLowerCase();if(DAYS.includes(v))cur=v;day[ci]=cur});
    const ar=(a[d+1]||[]).map(nArea);
    for(let r=d+2;r<end;r++)(a[r]||[]).forEach((c,ci)=>{const v=cl(c).toUpperCase();if(!v)return;
      if(CODE.test(v)){if(!day[ci])return;const o=sc[v]||(sc[v]={days:[],area:''});if(!o.days.includes(day[ci]))o.days.push(day[ci]);o.area=RIYADH_SET.has(v)?'RIYADH':(ar[ci]||o.area)}else ar[ci]=nArea(v)})});return sc}
function parseJed(a){const hi=a.findIndex(r=>r.filter(c=>cl(c)&&!CODE.test(cl(c).toUpperCase())).length>=2);if(hi<0)return{};const dr={};
  a.slice(hi+1).forEach(r=>r.forEach((c,ci)=>{const v=cl(c).toUpperCase();if(CODE.test(v)&&cl(a[hi][ci]))dr[v]=cl(a[hi][ci]).toUpperCase()}));return dr}

function nextDate(days){const t=new Date();t.setHours(0,0,0,0);let best=null;(days||[]).forEach(d=>{const i=DAYS.indexOf(d);if(i<0)return;const x=new Date(t);x.setDate(t.getDate()+(i-t.getDay()+7)%7);if(!best||x<best)best=x});return best}

  (bad.length?'<div class="m er">Invalid rows (first 15): '+bad.slice(0,15).map(b=>'line '+b.line+' ['+esc(b.wh+' '+b.del+' '+b.ph)+'] '+b.e).join(' &middot; ')+'</div>':'')+
  (ok.length?tbl(['WH','Delivery','PH','Area'],ok.slice(0,50).map(o=>'<tr><td>'+esc(o.wh)+'</td><td>'+esc(o.del)+'</td><td>'+esc(o.ph)+'</td><td>'+(RIYADH_SET.has(o.ph)?'<span class="tag riyadh">RIYADH</span>':esc((S.sched[o.ph]||{}).area||'-'))+'</td></tr>'))+'<div class="row"><button class="b" onclick="commit()">Save '+ok.length+' orders</button></div>':'<div class="m">Nothing new to save.</div>')+'</div>'}
function commit(){if(!pend)return;const have=new Set(S.orders.map(o=>o.del));let n=0;pend.ok.forEach(o=>{if(have.has(o.del))return;have.add(o.del);S.orders.push({id:'O'+Date.now()+'_'+n++,wh:o.wh,del:o.del,ph:o.ph,added:new Date().toISOString(),by:S.user||'-',status:'R',reason:''})});
  log(pend.src.startsWith('upload')?'Upload':'Manual entry',n+' orders ('+pend.src+')');save();pend=null;$('pv').innerHTML='<div class="card ok"><b>&#10004; '+n+' orders saved.</b> Duplicates were ignored; the first record is always kept.</div>'}

let SEL=new Set(),drag=null;
function selRow(tr,on){const id=tr.dataset.id;if(on){SEL.add(id);tr.classList.add('sel')}else{SEL.delete(id);tr.classList.remove('sel')}}

function toggleAllVisible(){
  const rows=[...document.querySelectorAll('#tb tr[data-id]')];
  if(!rows.length)return;
  const allChecked=rows.every(tr=>SEL.has(tr.dataset.id));
  rows.forEach(tr=>selRow(tr,!allChecked));
  updAB();
}

function updAB(){
  const b=$('ab');if(!b)return;
  const rows=[...document.querySelectorAll('#tb tr[data-id]')];
  const total=rows.length, n=SEL.size;
  const allChecked=total>0 && n===total;
  const partial=n>0 && n<total;
  const isShipTab=(tab==='ship');

  const opt1='<button type="button" class="tgl-box'+(allChecked?' checked':partial?' partial':'')+'" onclick="toggleAllVisible()">'+
    '<span class="bx"></span><span>'+(allChecked?'Unselect All ('+n+')':'Select All ('+total+')')+'</span></button>';

  const opt2='<button type="button" class="o" onclick="copySel()"'+(n?'':' style="opacity:.65"')+'>&#128203; Copy'+(n?' ('+n+')':'')+'</button>';

  const opt3=isShipTab
    ? (n?'<button type="button" class="o r" onclick="restoreSel()">&#8634; Restore to Remaining ('+n+')</button>':'')
    : '<button type="button" class="b okbtn" onclick="completeSel()"'+(n?'':' style="opacity:.65"')+'>&#10004; Shipment Complete'+(n?' ('+n+')':'')+'</button>';

  b.innerHTML=opt1+opt2+opt3+(n?'<span class="tag" style="margin-left:auto">'+n+' of '+total+' selected</span>':'<span class="m" style="margin:0 0 0 auto">Click checkbox to Select All / Unselect All</span>');
}

function tickG(b){const ids=new Set(b.dataset.ids.split(','));const rows=[...document.querySelectorAll('#tb tr[data-id]')].filter(tr=>ids.has(tr.dataset.id));const all=rows.every(tr=>SEL.has(tr.dataset.id));rows.forEach(tr=>selRow(tr,!all));updAB()}
function selDels(){return[...document.querySelectorAll('#tb tr.sel td.dl')].map(x=>x.textContent.trim())}
function copySel(){const l=selDels();if(!l.length)return alert('Please select at least 1 row first.');copy(l.join('\n'));const b=$('ab');if(b){const old=b.querySelector('.cp-msg');if(old)old.remove();b.insertAdjacentHTML('beforeend','<b class="ok cp-msg">&#10004; Copied '+l.length+' deliveries!</b>')}}
function completeSel(){const ids=[...SEL];if(!ids.length)return alert('Please select rows first.');if(!confirm('Mark '+ids.length+' deliveries as Shipment Complete?'))return;const t=new Date().toISOString(),dl=[];
  ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&o.status==='R'){o.status='S';o.doneAt=t;o.doneBy=S.user||'-';dl.push(o.del)}});log('Shipment complete',dl.length+' deliveries: '+dl.slice(0,6).join(', ')+(dl.length>6?' ...':''));save();SEL=new Set();render()}
function restoreSel(){const ids=[...SEL];if(!ids.length)return;if(!confirm('Move '+ids.length+' deliveries back to Remaining?'))return;
  ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(o&&o.status==='S'){o.status='R';o.doneAt='';o.doneBy=''}});log('Restore',ids.length+' deliveries moved back to Remaining');save();SEL=new Set();render()}

document.addEventListener('mousedown',e=>{const c=e.target.closest('#tb td.ck');if(!c)return;e.preventDefault();const tr=c.parentNode;drag=!SEL.has(tr.dataset.id);selRow(tr,drag);updAB()});
document.addEventListener('mouseover',e=>{if(drag===null)return;const c=e.target.closest('#tb td.ck');if(c){selRow(c.parentNode,drag);updAB()}});
document.addEventListener('mouseup',()=>{drag=null});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&SEL.size&&!String(window.getSelection()).trim()&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();copySel()}});

const FL={wh:'WH',area:'Area',driver:'Driver',reason:'Reason',next:'Date',doneDay:'Completed Date',doneBy:'Completed By'};
const fv=(o,k)=>k==='next'?(o.nextL||'Unmapped'):k==='doneDay'?((o.doneAt||'').slice(0,10)||'(none)'):(o[k]||'(none)');
let LM=0;
function ms(k,opts,store,fn){const sel=store[k]||[];return'<details class="ms" data-k="'+k+'"><summary>'+FL[k]+(sel.length?' ('+sel.length+')':'')+' &#9662;</summary><div class="mo">'+opts.map(v=>'<label><input type="checkbox" value="'+esc(v)+'"'+(sel.includes(v)?' checked':'')+' onchange="'+fn+'(\''+k+'\',this.value,this.checked)"> '+esc(v)+'</label>').join('')+'</div></details>'}
function togF(k,v,on){const a=(F[k]||[]).filter(x=>x!==v);if(on)a.push(v);F[k]=a;const sm=document.querySelector('details[data-k="'+k+'"] summary');if(sm)sm.innerHTML=FL[k]+(a.length?' ('+a.length+')':'')+' &#9662;';drawL()}
document.addEventListener('click',e=>document.querySelectorAll('details.ms[open]').forEach(x=>{if(!x.contains(e.target))x.open=false}));
function clrF(){const ds=F.ds,g=F.g;F={ds,g};render()}

function listV(d,mode){LM=mode;const all=rem(),today=ymd(new Date()),opt=k=>[...new Set(all.map(o=>fv(o,k)))].sort();let top='';
  if(mode){const dc=cnt(all,o=>o.nextL||'Unmapped'),ds=Object.keys(dc).sort((a,b)=>a==='Unmapped'?1:b==='Unmapped'?-1:a.localeCompare(b));if(!ds.includes(F.ds))F.ds=ds[0];
    top='<div class="m">Choose a shipment date:</div>'+(ds.map(k=>'<button class="ch'+(F.ds===k?' on':'')+'" onclick="F.ds=\''+k+'\';render()">'+(k.startsWith(today)?'Today &middot; ':'')+k.replace(/^\d{4}-/,'')+' ('+dc[k]+')</button>').join('')||'<div class="m">No remaining orders.</div>')+'<div class="m" style="margin-top:10px">Group inside the date by:</div>'+[['area','Area'],['driver','Driver'],['reason','Reason'],['','None']].map(([k,l])=>'<button class="ch'+((F.g===undefined?'area':F.g)===k?' on':'')+'" onclick="F.g=\''+k+'\';render()">'+l+'</button>').join('')}
  d.innerHTML='<div class="card"><h3>'+(mode?'Shipment Dates':'Remaining Orders')+'</h3>'+top+'<div class="row"><input id="q" placeholder="Search Delivery / PH" value="'+esc(F.q||'')+'" oninput="F.q=this.value;drawL()">'+ms('wh',opt('wh'),F,'togF')+ms('area',opt('area'),F,'togF')+ms('driver',opt('driver'),F,'togF')+ms('reason',opt('reason'),F,'togF')+(mode?'':ms('next',opt('next'),F,'togF'))+'<button class="o" onclick="clrF()">Clear filters</button></div><div id="tb"></div></div>';drawL()}

function areaBadge(a){if(!a)return'<span class="tag u">Unmapped</span>';if(a==='RIYADH')return'<span class="tag riyadh">RIYADH</span>';return esc(a)}
function rowH(o){return'<tr data-id="'+o.id+'"'+(SEL.has(o.id)?' class="sel"':'')+'><td class="ck"><span class="bx"></span></td><td>'+esc(o.wh)+'</td><td class="dl">'+esc(o.del)+'</td><td>'+esc(o.ph)+(o.inactive?' <span class="tag x">inactive</span>':'')+'</td><td>'+areaBadge(o.area)+'</td><td>'+esc(o.driver)+'</td>'+(LM?'':'<td>'+(esc(o.nextL)||'<span class="tag u">Unmapped</span>')+'</td>')+'<td><select onchange="setReason(\''+o.id+'\',this.value)"><option value="">-</option>'+S.reasons.map(x=>'<option'+(o.reason===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></td></tr>'}

function drawL(){const q=(F.q||'').toUpperCase(),ks=LM?['wh','area','driver','reason']:['wh','area','driver','reason','next'];
  const r=rem().filter(o=>(!LM||(o.nextL||'Unmapped')===F.ds)&&(!q||o.del.includes(q)||o.ph.includes(q))&&ks.every(k=>!(F[k]&&F[k].length)||F[k].includes(fv(o,k)))).sort((a,b)=>phCmp(a.ph,b.ph)||a.del.localeCompare(b.del));
  const vis=new Set(r.map(o=>o.id));SEL=new Set([...SEL].filter(x=>vis.has(x)));const H=['&#9745;','WH','Delivery','PH','Area','Driver'].concat(LM?[]:['Ship date']).concat(['Reason']),g=LM?(F.g===undefined?'area':F.g):'';let h='<div class="ab" id="ab"></div>';
  if(!g)h+='<div class="row"><b>'+r.length+' orders</b></div>'+tbl(H,r.slice(0,1000).map(rowH));
  else{const G={};r.forEach(o=>(G[fv(o,g)]=G[fv(o,g)]||[]).push(o));h+='<div class="m"><b>'+r.length+' orders</b></div>'+(Object.keys(G).sort().map(k=>'<h3 style="margin:16px 0 8px">'+esc(k)+' <span class="tag">'+G[k].length+'</span> <button class="s" data-copy="'+esc(G[k].map(o=>o.del).join('\n'))+'">Copy '+G[k].length+'</button> <button class="s" data-ids="'+G[k].map(o=>o.id).join(',')+'" onclick="tickG(this)">Select / Unselect '+G[k].length+'</button></h3>'+tbl(H,G[k].map(rowH))).join('')||'<div class="m">No orders for this selection.</div>')}
  $('tb').innerHTML=h;updAB()}
function setReason(id,v){const o=S.orders.find(x=>x.id===id);o.reason=v;log('Reason',o.del+' = '+v);save()}

function togSF(k,v,on){const a=(SF[k]||[]).filter(x=>x!==v);if(on)a.push(v);SF[k]=a;const sm=document.querySelector('details[data-k="'+k+'"] summary');if(sm)sm.innerHTML=FL[k]+(a.length?' ('+a.length+')':'')+' &#9662;';drawShip()}
function clrSF(){SF={};render()}
function ship(d){
  const all=shp(),opt=k=>[...new Set(all.map(o=>fv(o,k)))].sort();
  d.innerHTML='<div class="card"><h3>Shipped History ('+all.length+')</h3>'+
  '<div class="row"><input id="sq" placeholder="Search Delivery / PH" value="'+esc(SF.q||'')+'" oninput="SF.q=this.value;drawShip()">'+
  ms('wh',opt('wh'),SF,'togSF')+ms('area',opt('area'),SF,'togSF')+ms('driver',opt('driver'),SF,'togSF')+ms('doneDay',opt('doneDay'),SF,'togSF')+ms('doneBy',opt('doneBy'),SF,'togSF')+
  '<button class="o" onclick="clrSF()">Clear filters</button></div>'+
  '<div id="tb"></div></div>';
  drawShip();
}
function drawShip(){
  const q=(SF.q||'').toUpperCase(),ks=['wh','area','driver','doneDay','doneBy'];
  const s=shp().filter(o=>(!q||o.del.includes(q)||o.ph.includes(q))&&ks.every(k=>!(SF[k]&&SF[k].length)||SF[k].includes(fv(o,k)))).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const vis=new Set(s.map(o=>o.id));SEL=new Set([...SEL].filter(x=>vis.has(x)));
  const H=['&#9745;','WH','Delivery','PH','Area','Driver','Completed','By'];
  const rows=s.slice(0,1000).map(o=>'<tr data-id="'+o.id+'"'+(SEL.has(o.id)?' class="sel"':'')+'><td class="ck"><span class="bx"></span></td><td>'+esc(o.wh)+'</td><td class="dl">'+esc(o.del)+'</td><td>'+esc(o.ph)+'</td><td>'+areaBadge(o.area)+'</td><td>'+esc(o.driver)+'</td><td>'+esc((o.doneAt||'').slice(0,16).replace('T',' '))+'</td><td>'+esc(o.doneBy)+'</td></tr>');
  $('tb').innerHTML='<div class="ab" id="ab"></div><div class="row"><b>'+s.length+' shipped orders</b></div>'+tbl(H,rows);
  updAB();
}

function rep(d){const H=['WH','Delivery','PH','Area','Ship date','Driver','Status','Reason'],R=l=>l.map(o=>[o.wh,o.del,o.ph,o.area,o.next,o.driver,o.status==='S'?'Shipped':'Remaining',o.reason]),all=()=>S.orders.map(view),sr=(l,f)=>R(l.slice().sort(f));
  const B=(l,fn)=>'<button class="b" onclick="'+fn+'">'+l+'</button> ';window.RP={all:()=>xl('All_Orders',H,R(all())),rem:()=>xl('Remaining',H,R(rem())),shp:()=>xl('Shipped_History',H,R(shp())),date:()=>xl('Date_Wise',H,sr(all(),(a,b)=>a.next.localeCompare(b.next)||phCmp(a.ph,b.ph))),area:()=>xl('Area_Wise',H,sr(all(),(a,b)=>a.area.localeCompare(b.area)||phCmp(a.ph,b.ph))),drv:()=>xl('Driver_Wise',H,sr(all().filter(o=>o.driver),(a,b)=>a.driver.localeCompare(b.driver)||phCmp(a.ph,b.ph))),ph:()=>xl('PH_Wise',H,sr(all(),(a,b)=>phCmp(a.ph,b.ph))),un:()=>xl('Unmapped',H,R(rem().filter(o=>!o.next)))};
  d.innerHTML='<div class="card"><h3>Export Excel reports</h3><div class="row">'+B('All Orders','RP.all()')+B('Remaining','RP.rem()')+B('Shipped History','RP.shp()')+B('Date Wise','RP.date()')+B('Area Wise','RP.area()')+B('Driver Wise','RP.drv()')+B('PH Wise','RP.ph()')+B('Unmapped','RP.un()')+'<button class="o" onclick="window.print()">Print</button></div></div>'}

function adminV(d){if(!adm){d.innerHTML='<div class="card"><h3>Admin Unlock</h3><div class="row"><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key===\'Enter\')login()"><button class="b" onclick="login()">Unlock</button></div></div>';return}
  d.innerHTML=
  '<div class="card" style="border-left:5px solid #16a34a"><h3>&#9729; Google Sheets Cloud Sync (Permanent Data Protection)</h3>'+
  '<div class="m">Paste your Google Apps Script Web App URL below. Once connected, every order, reason, schedule, and Riyadh plant setting is automatically saved to Google Sheets so data is never lost.</div>'+
  '<div class="row"><input id="gsUrl" style="flex:1;min-width:280px" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(S.gsUrl||'')+'"><button class="b okbtn" onclick="saveGsUrl()">Save &amp; Connect</button><button class="o" onclick="cloudPush(true)">Push to Sheet</button><button class="o" onclick="cloudPull(true)">Pull from Sheet</button></div></div>'+

  '<div class="card"><h3>&#127758; Regional Masters (Jeddah, Makkah, Riyadh &amp; 205 Plants)</h3>'+
  '<div class="m">All regional schedules from <b>Loading_Prefix_P.xlsx</b> plus 205 Riyadh plants are fully integrated and active.</div></div>'+

  '<div class="card"><h3>Schedule Management</h3><div class="m">Upload new schedule Excel (must contain sheets <b>ALL</b> and <b>JEDDAH</b>):</div><div class="row"><input type="file" id="sf" accept=".xlsx,.xls"></div><div id="sp"></div>'+
  '<h4>Schedule history</h4>'+tbl(['Name','Uploaded','PHs','Status',''],S.hist.map(h=>'<tr><td>'+esc(h.name)+'</td><td>'+esc(h.date.slice(0,16).replace('T',' '))+'</td><td>'+Object.keys(h.sched).length+'</td><td>'+(h.id===S.active?'<span class="tag">Active</span>':'')+'</td><td>'+(h.id!==S.active?'<button class="s" onclick="actSch(\''+h.id+'\')">Activate</button>':'')+'</td></tr>'))+'</div>'+

  '<div class="card"><h3>PH / Plant Master</h3><div class="row"><input id="np" placeholder="PH e.g. P658"><select id="nd"><option value="">(schedule default)</option>'+DAYS.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="na" placeholder="Area e.g. RIYADH" value="RIYADH"><input id="nr" placeholder="Driver"><button class="b" onclick="addPh()">Save PH</button></div>'+
  tbl(['PH','Override day','Area','Driver','Status',''],Object.keys({...S.sched,...S.phs}).sort(phCmp).slice(0,250).map(p=>{const x=S.phs[p]||{};const ar=RIYADH_SET.has(p)?'RIYADH':(x.area||(S.sched[p]||{}).area||'');return'<tr><td>'+esc(p)+'</td><td>'+esc(x.day||'-')+'</td><td>'+areaBadge(ar)+'</td><td>'+esc(S.drivers[p]||'-')+'</td><td>'+(x.active===false?'<span class="tag x">Inactive</span>':'Active')+'</td><td><button class="s" onclick="togPh(\''+p+'\')">Toggle</button></td></tr>'}))+'</div>'+

  '<div class="card"><h3>Reasons &amp; JSON Backup</h3><div class="row"><input id="rn" placeholder="New reason"><button class="b" onclick="addR()">Add</button></div><div class="row">'+S.reasons.map((r,i)=>'<span class="tag">'+esc(r)+' <a href="#" onclick="S.reasons.splice('+i+',1);save();render();return false">&times;</a></span>').join(' ')+'</div>'+
  '<div class="row" style="margin-top:12px"><button class="b" onclick="bk()">Download JSON Backup</button><label class="o" style="cursor:pointer">Restore JSON <input type="file" accept=".json" style="display:none" onchange="rs(this.files[0])"></label><button class="s r" onclick="if(confirm(\'Delete all orders on this browser?\')){S.orders=[];log(\'Reset\',\'All orders cleared\');save();render()}">Clear all orders</button></div></div>'+

  '<div class="card"><h3>Audit log</h3>'+tbl(['Time','User','Action','Detail'],S.audit.slice(0,80).map(a=>'<tr><td>'+esc(a.t.slice(0,16).replace('T',' '))+'</td><td>'+esc(a.u)+'</td><td>'+esc(a.a)+'</td><td>'+esc(a.d)+'</td></tr>'))+'</div>';

  $('sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const sh=await readSheets(f);if(!sh.ALL||!sh.JEDDAH)throw new Error('Both sheets "ALL" and "JEDDAH" are required');
    const sc=parseAll(sh.ALL),dr=parseJed(sh.JEDDAH);if(!Object.keys(sc).length)throw new Error('No PH codes found in ALL');pendSch={name:f.name,sched:sc,drivers:dr};
    $('sp').innerHTML='<div class="m ok">Ready: <b>'+Object.keys(sc).length+'</b> PHs in ALL, <b>'+Object.keys(dr).length+'</b> drivers in JEDDAH. <button class="b" onclick="saveSch()">Activate schedule</button></div>'}catch(x){$('sp').innerHTML='<div class="m er">'+esc(x.message)+'</div>'}e.target.value=''}}

function saveGsUrl(){S.gsUrl=$('gsUrl').value.trim();save(true);if(S.gsUrl)cloudPull(true);else render();}
function login(){if($('pw').value==='admin123'){adm=true;sessionStorage.setItem('p4adm','1');render()}else alert('Wrong password')}
function saveSch(){const h={id:'S'+Date.now(),name:pendSch.name,date:new Date().toISOString(),sched:pendSch.sched,drivers:pendSch.drivers};S.hist.unshift(h);applySch(h);log('Schedule',h.name);save();pendSch=null;render()}
function actSch(id){const h=S.hist.find(x=>x.id===id);if(!h)return;applySch(h);log('Activate schedule',h.name);save();render()}
function addPh(){const p=$('np').value.trim().toUpperCase();if(!CODE.test(p))return alert('Invalid PH code');S.phs[p]={day:$('nd').value,area:$('na').value.trim().toUpperCase(),active:true};if($('nr').value.trim())S.drivers[p]=$('nr').value.trim().toUpperCase();log('PH edit',p);save();render()}
function togPh(p){S.phs[p]=S.phs[p]||{};S.phs[p].active=S.phs[p].active===false;save();render()}
function addR(){const v=$('rn').value.trim();if(v&&!S.reasons.includes(v)){S.reasons.push(v);save();render()}}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='project4_backup_'+ymd(new Date())+'.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.orders)throw 0;S=d;injectRiyadhMaster();log('Restore','JSON backup');save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}

ensureSched();
render();
if(S.gsUrl) cloudPull(false);
</script>
